<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeff Channel Switcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-render-blocking on purpose: if Google Fonts is slow or unreachable,
     the channel still starts on time and falls back to monospace. -->
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"
      media="print" onload="this.media='all'">
<style>
  :root{
    --accent:#46ff5a;
    --accent-soft:#b8ffc0;
    --scale:1;
    --pad-x:4vw;
    --pad-y:7vh;
    --mono:'VT323','Courier New',ui-monospace,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(9px,calc(100vw / 120),30px)}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:var(--mono);color:#fff;cursor:none;-webkit-font-smoothing:antialiased}

  /* ---------- video stack ---------- */
  #stage{position:fixed;inset:0;background:#000}
  video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;background:#000;opacity:0;
    /* deliberately no transition — episodes hard-cut */
  }
  video.live{opacity:1;z-index:2}
  video.standby{opacity:0;z-index:1}
  body.fit-cover video{object-fit:cover}

  /* ---------- CRT effects ---------- */
  #scan{
    position:fixed;inset:0;z-index:5;pointer-events:none;display:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);
  }
  body.scanlines #scan{display:block}
  #vig{
    position:fixed;inset:0;z-index:5;pointer-events:none;display:none;
    background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%);
  }
  body.vignette #vig{display:block}
  body.flicker #stage{animation:flick 5.2s steps(1) infinite}
  @keyframes flick{0%,97%{opacity:1}97.5%{opacity:.93}98%{opacity:1}98.6%{opacity:.96}99%{opacity:1}}

  /* ---------- standby card ---------- */
  #idle{
    position:fixed;inset:0;z-index:3;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:1.2rem;
    background:#000;
  }
  body.idle #idle{display:flex}
  #idleText{
    font-size:3.6rem;line-height:1;color:var(--accent);
    letter-spacing:.14em;text-transform:uppercase;
    text-shadow:0 0 .7rem var(--accent),.18rem .18rem 0 #000;
  }
  #idleSub{
    font-size:1.9rem;line-height:1;color:var(--accent-soft);opacity:.65;
    letter-spacing:.12em;text-transform:uppercase;
  }
  #idleBar{
    width:22rem;max-width:60vw;height:.5rem;background:rgba(255,255,255,.08);
    overflow:hidden;
  }
  #idleBar i{
    display:block;width:34%;height:100%;background:var(--accent);
    box-shadow:0 0 .8rem var(--accent);
    animation:sweep 1.9s ease-in-out infinite;
  }
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

  /* ---------- scrim (off by default in CRT) ---------- */
  #scrim{position:fixed;left:0;right:0;z-index:4;pointer-events:none;height:34vh;display:none}
  body.scrim #scrim{display:block}
  body.scrim.pos-bl #scrim,body.scrim.pos-br #scrim{bottom:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent)}
  body.scrim.pos-tl #scrim,body.scrim.pos-tr #scrim{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}

  /* ---------- lower third ---------- */
  #ovl{
    position:fixed;z-index:6;display:flex;flex-direction:column;gap:.1rem;
    transform:scale(var(--scale));max-width:72vw;
    opacity:1;transition:opacity .4s;
  }
  #ovl.hidden{opacity:0}
  body.pos-bl #ovl{left:var(--pad-x);bottom:var(--pad-y);align-items:flex-start;transform-origin:left bottom}
  body.pos-br #ovl{right:var(--pad-x);bottom:var(--pad-y);align-items:flex-end;text-align:right;transform-origin:right bottom}
  body.pos-tl #ovl{left:var(--pad-x);top:var(--pad-y);align-items:flex-start;transform-origin:left top}
  body.pos-tr #ovl{right:var(--pad-x);top:var(--pad-y);align-items:flex-end;text-align:right;transform-origin:right top}
  body.no-overlay #ovl,body.no-overlay #scrim,body.no-overlay #bug{display:none}

  #headline{
    font-size:2.6rem;line-height:1;color:#fff;
    letter-spacing:.2em;text-transform:uppercase;
    text-shadow:0 0 .7rem rgba(255,255,255,.45),.18rem .18rem 0 #000;
    margin-bottom:.5rem;display:none;
  }
  #headline.on{display:block}

  #card{display:flex;gap:.9rem;align-items:stretch}
  body.pos-br #card,body.pos-tr #card{flex-direction:row-reverse}
  #rule{
    width:.28rem;border-radius:.28rem;background:var(--accent);
    box-shadow:0 0 1.2rem var(--accent);flex:none;display:none;
  }
  #cardText{display:flex;flex-direction:column;gap:.05rem;min-width:0}

  #label{
    display:flex;align-items:baseline;gap:.4rem;
    font-size:2.3rem;line-height:1.05;color:var(--accent-soft);
    letter-spacing:.06em;
    text-shadow:0 0 .6rem var(--accent),.18rem .18rem 0 #000;
  }
  body.pos-br #label,body.pos-tr #label{flex-direction:row-reverse}
  #dot{
    display:inline-block;width:.85rem;height:1.5rem;background:var(--accent);
    box-shadow:0 0 .7rem var(--accent);flex:none;
  }
  body.pulse #dot{animation:blip 1.1s steps(1) infinite}
  @keyframes blip{0%,49%{opacity:1}50%,100%{opacity:0}}
  body.idle #label{display:none}

  #title{
    font-size:4.4rem;line-height:1.02;color:var(--accent);
    letter-spacing:.01em;
    text-shadow:0 0 .8rem var(--accent),.2rem .2rem 0 #000;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }

  /* ---------- channel bug ---------- */
  #bug{
    position:fixed;z-index:6;font-size:2rem;line-height:1;
    color:var(--accent-soft);letter-spacing:.18em;text-transform:uppercase;
    text-shadow:0 0 .6rem var(--accent),.16rem .16rem 0 #000;display:none;
  }
  #bug.on{display:block}
  body.pos-bl #bug,body.pos-br #bug{top:var(--pad-y);right:var(--pad-x)}
  body.pos-tl #bug,body.pos-tr #bug{bottom:var(--pad-y);right:var(--pad-x)}

  /* ---------- centre message ---------- */
  #msg{
    position:fixed;left:0;right:0;top:8%;z-index:8;text-align:center;
    font-size:2.6rem;line-height:1.2;color:#fff;
    text-shadow:.16rem .16rem 0 #000;pointer-events:none;
  }

  /* ---------- fallback when VT323 doesn't load ---------- */
  body.nofont{--mono:'Courier New',ui-monospace,monospace}
  body.nofont #title{font-size:2.9rem;letter-spacing:-.02em}
  body.nofont #label{font-size:1.4rem}
  body.nofont #headline{font-size:1.7rem}
  body.nofont #bug{font-size:1.3rem}
  body.nofont #idleText{font-size:2.3rem}
  body.nofont #idleSub{font-size:1.2rem}
  body.nofont #msg{font-size:1.7rem}
  body.nofont #dot{height:1.1rem;width:.6rem}

  /* ---------- alternate clean broadcast theme ---------- */
  body.theme-broadcast{font-family:var(--sans)}
  body.theme-broadcast #idle{
    background:radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,.05),transparent 70%),
               linear-gradient(160deg,#0b0d11,#07080a 55%,#0a0c10);
  }
  body.theme-broadcast #rule{display:block}
  body.theme-broadcast #ovl{gap:.85rem}
  body.theme-broadcast #cardText{gap:.34rem}
  body.theme-broadcast #title{
    font-size:2.7rem;font-weight:700;color:#fff;letter-spacing:-.01em;
    text-shadow:0 .14rem .85rem rgba(0,0,0,.85);
  }
  body.theme-broadcast #label{
    font-size:.92rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);text-shadow:0 .1rem .5rem rgba(0,0,0,.75);align-items:center;
  }
  body.theme-broadcast #dot{width:.52rem;height:.52rem;border-radius:50%}
  body.theme-broadcast.pulse #dot{animation:blipsoft 2.4s ease-in-out infinite}
  @keyframes blipsoft{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  body.theme-broadcast #headline{font-size:1.5rem;font-weight:800;letter-spacing:.26em}
  body.theme-broadcast #bug{font-size:1rem;font-weight:800;letter-spacing:.24em;color:rgba(255,255,255,.82)}
  body.theme-broadcast #idleText{font-size:1.05rem;font-weight:700;letter-spacing:.3em;color:rgba(255,255,255,.62);text-shadow:none}
  body.theme-broadcast #idleSub{font-size:.85rem;letter-spacing:.14em;color:rgba(255,255,255,.3)}
  body.theme-broadcast #scrim{display:block}

  /* ---------- debug ---------- */
  #dbg{
    position:fixed;z-index:9;left:.8rem;top:.8rem;
    background:rgba(0,0,0,.85);border:1px solid rgba(70,255,90,.3);
    padding:.7rem .9rem;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.72rem;line-height:1.6;color:#8f8;white-space:pre;display:none;
    max-height:92vh;overflow:hidden;
  }
  body.debug #dbg{display:block}
  body.debug{cursor:default}
</style>
</head>
<body>

<div id="stage">
  <video id="v0" playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
  <video id="v1" playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
</div>

<div id="idle">
  <div id="idleText">Standing By</div>
  <div id="idleBar"><i></i></div>
  <div id="idleSub"></div>
</div>

<div id="scan"></div>
<div id="vig"></div>
<div id="scrim"></div>

<div id="ovl">
  <div id="headline"></div>
  <div id="card">
    <div id="rule"></div>
    <div id="cardText">
      <div id="label"><span id="labelText">Now playing</span><span id="dot"></span></div>
      <div id="title">&nbsp;</div>
    </div>
  </div>
</div>

<div id="bug"></div>
<div id="msg"></div>
<div id="dbg"></div>

<script>
"use strict";
/* ============================================================================
   JEFF CHANNEL SWITCHER

   An always-running TV channel for an OBS browser source. Reads a playlist file
   next to this page, shuffles it with no repeats until every episode has aired,
   plays each one all the way through, and hard-cuts to the next. The first
   episode of a session starts partway in so it feels like you tuned in mid-show.

   Built to survive a bad night: dead files are skipped, the next episode is
   preloaded on a second video element, a watchdog catches stalls, and if nothing
   at all will play it shows a standby card and keeps trying instead of going
   black. No build step, no dependencies beyond the display font.

   Every setting is a URL parameter — see CFG below.
   ========================================================================= */

/* ---------------------------------------------------------------- params */
const Q = new URLSearchParams(location.search);
const pStr  = (k, d) => { const v = Q.get(k); return v === null ? d : v; };
const pNum  = (k, d) => { const v = parseFloat(Q.get(k)); return Number.isFinite(v) ? v : d; };
const pBool = (k, d) => { const v = Q.get(k); return v === null ? d : !/^(0|false|no|off)$/i.test(v); };

const THEME = /^broadcast$/i.test(pStr('theme', 'crt')) ? 'broadcast' : 'crt';

// volume accepts either 0-1 or 0-100, so old links keep working
const rawVol = pNum('volume', 1);
const VOLUME = rawVol > 1 ? Math.min(100, rawVol) / 100 : Math.max(0, rawVol);

// title=always | auto (show for 10s after each change) | off
const TITLE_MODE = (pStr('title', 'always').toLowerCase().match(/^(always|auto|off)$/) || ['always'])[0];

const CFG = {
  list:      pStr('list', 'videos.txt'),
  base:      pStr('base', ''),
  shuffle:   pBool('shuffle', true),
  // `randomstart` is the old name for this; both work
  startMid:  pBool('randomstart', pBool('startMid', true)),
  startMin:  pNum('startMin', 0.05),
  startMax:  pNum('startMax', 0.75),
  muted:     pBool('muted', false),
  volume:    VOLUME,
  label:     pStr('label', 'Now playing'),
  headline:  pStr('headline', ''),
  bug:       pStr('bug', ''),
  accent:    '#' + pStr('accent', THEME === 'crt' ? '46ff5a' : 'ffb020').replace(/^#/, ''),
  scale:     pNum('scale', 1),
  pos:       (pStr('pos', 'bl').toLowerCase().match(/^(bl|br|tl|tr)$/) || ['bl'])[0],
  overlay:   TITLE_MODE !== 'off' && pBool('overlay', true),
  titleMode: TITLE_MODE,
  fit:       pStr('fit', 'contain'),
  pulse:     pBool('pulse', true),
  scanlines: pBool('scanlines', false),
  vignette:  pBool('vignette', false),
  flicker:   pBool('flicker', false),
  scrim:     pBool('scrim', THEME === 'broadcast'),
  font:      pStr('font', ''),
  saver:     pBool('saver', false),
  remember:  pBool('remember', true),
  retry:     pNum('retry', 600),
  stall:     pNum('stall', 20),
  reload:    pNum('reload', 0),
  debug:     pBool('debug', false)
};

/* ---------------------------------------------------------------- elements */
const v0 = document.getElementById('v0');
const v1 = document.getElementById('v1');
const elTitle    = document.getElementById('title');
const elLabelTxt = document.getElementById('labelText');
const elHeadline = document.getElementById('headline');
const elBug      = document.getElementById('bug');
const elOvl      = document.getElementById('ovl');
const elIdleSub  = document.getElementById('idleSub');
const elMsg      = document.getElementById('msg');
const elDbg      = document.getElementById('dbg');

/* ---------------------------------------------------------------- chrome */
function tintToward(hex, amount) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const mix = c => Math.round(c + (255 - c) * amount);
  return 'rgb(' + mix((n >> 16) & 255) + ',' + mix((n >> 8) & 255) + ',' + mix(n & 255) + ')';
}
const root = document.documentElement;
root.style.setProperty('--accent', CFG.accent);
root.style.setProperty('--accent-soft', tintToward(CFG.accent, 0.55));
root.style.setProperty('--scale', String(CFG.scale));
if (CFG.font) root.style.setProperty('--mono', CFG.font + ",'Courier New',monospace");

document.body.classList.add('theme-' + THEME, 'pos-' + CFG.pos);
if (CFG.fit === 'cover') document.body.classList.add('fit-cover');
if (!CFG.overlay) document.body.classList.add('no-overlay');
if (CFG.pulse) document.body.classList.add('pulse');
if (CFG.scanlines) document.body.classList.add('scanlines');
if (CFG.vignette) document.body.classList.add('vignette');
if (CFG.flicker) document.body.classList.add('flicker');
if (CFG.scrim) document.body.classList.add('scrim');
if (CFG.debug) document.body.classList.add('debug');
elLabelTxt.textContent = CFG.label;
if (CFG.headline) { elHeadline.textContent = CFG.headline; elHeadline.classList.add('on'); }
if (CFG.bug) { elBug.textContent = CFG.bug; elBug.classList.add('on'); }

// If the display font never arrives, fall back to a wider monospace and shrink
// the type so the lower third keeps its proportions.
if (THEME === 'crt' && !CFG.font && document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    try { if (!document.fonts.check("1em 'VT323'")) document.body.classList.add('nofont'); }
    catch (e) { /* older engine — leave the default sizing */ }
  });
  setTimeout(() => {
    try { if (!document.fonts.check("1em 'VT323'")) document.body.classList.add('nofont'); }
    catch (e) {}
  }, 4000);
}

/* ---------------------------------------------------------------- state */
let items   = [];     // [{ url, title, deadUntil, fails }]
let bag     = [];     // indices not yet aired this cycle
let lastIdx = -1;
let curIdx  = -1;
let nextIdx = -1;
let live    = v0;     // element currently on screen
let hold    = v1;     // element being primed in the background
const IN_OBS = !!window.obsstudio;
let audioBlocked = false;
let advancing = false;
let idle = true;
let resumed = false;
let listSig = '';
let titleTimer = null;
let offAirAt = null;
let stats = { aired: 0, skipped: 0, cycles: 0, started: Date.now() };

/* ---------------------------------------------------------------- helpers */
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const now   = () => Date.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Dropbox share links need raw=1 to serve the actual bytes. */
function normalizeUrl(u) {
  u = u.trim();
  if (CFG.base && !/^(https?:)?\/\//i.test(u) && !u.startsWith('/')) {
    u = CFG.base.replace(/\/+$/, '') + '/' + u.replace(/^\/+/, '');
  }
  if (/dropbox(usercontent)?\.com/i.test(u)) {
    u = u.replace(/([?&])dl=[01]/ig, '$1raw=1');
    if (!/[?&]raw=1/i.test(u)) u += (u.includes('?') ? '&' : '?') + 'raw=1';
  }
  return u;
}

/** Turn a file name into something presentable when no custom title is given. */
function titleFromUrl(u) {
  let path;
  try { path = new URL(u, location.href).pathname; }
  catch (e) { path = String(u).split('?')[0]; }
  let n = path.split('/').pop() || '';
  try { n = decodeURIComponent(n); } catch (e) {}
  n = n.replace(/\.[a-z0-9]{2,5}$/i, '');                      // extension
  n = n.replace(/[\[\(][A-Za-z0-9_-]{11}[\]\)]\s*$/, '');      // trailing youtube id
  n = n.replace(/[\s._-]*\b(2160p|1440p|1080p|720p|480p|4k|60fps|30fps|h264|hevc|aac)\b/ig, '');
  n = n.replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
  n = n.replace(/[\s\-–—_]+$/, '').trim();
  return n || 'Untitled Episode';
}

function parsePlaylist(text) {
  const out = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith('#') || line.startsWith('//')) continue;
    let title = null, url = line;
    // Split on the LAST pipe: episode titles legitimately contain them
    // ("... | Jeff's Barbershop"), whereas URLs never do.
    const bar = line.lastIndexOf('|');
    if (bar > -1) { title = line.slice(0, bar).trim(); url = line.slice(bar + 1).trim(); }
    if (!url) continue;
    url = normalizeUrl(url);
    out.push({ url, title: title || titleFromUrl(url), deadUntil: 0, fails: 0 });
  }
  return out;
}

/* ---------------------------------------------------------------- rotation */
function aliveIndices() {
  const t = now();
  let alive = [];
  for (let i = 0; i < items.length; i++) if (items[i].deadUntil <= t) alive.push(i);
  if (!alive.length) {                       // everything is benched — give them all another go
    items.forEach(it => { it.deadUntil = 0; });
    alive = items.map((_, i) => i);
  }
  return alive;
}

function refillBag() {
  const pool = aliveIndices();
  bag = CFG.shuffle ? shuffled(pool) : pool.slice();
  // don't let a cycle boundary produce the same episode twice in a row
  if (bag.length > 1 && bag[0] === lastIdx) { [bag[0], bag[1]] = [bag[1], bag[0]]; }
  stats.cycles++;
  persist();
}

/** Next index to air, skipping anything currently benched. -1 if nothing is playable. */
function takeNext() {
  if (!items.length) return -1;
  for (let guard = 0; guard < 2; guard++) {
    if (!bag.length) refillBag();
    while (bag.length) {
      const i = bag.shift();
      if (i < items.length && items[i].deadUntil <= now()) { persist(); return i; }
    }
  }
  return -1;
}

/**
 * Put an index back at the front of the cycle. Used whenever an episode was
 * pulled from the bag but never actually aired — otherwise it would silently
 * miss its turn and the "no repeats until everything has played" promise breaks.
 */
function returnToBag(i) {
  if (i < 0 || i >= items.length) return;
  if (!bag.includes(i)) bag.unshift(i);
  persist();
}

function bench(i, why) {
  if (i < 0 || i >= items.length) return;
  items[i].fails++;
  items[i].deadUntil = now() + CFG.retry * 1000;
  stats.skipped++;
  log('benched [' + i + '] ' + (why || '') + ' — ' + items[i].title);
}

/* ---------------------------------------------------------------- persistence */
const STORE_KEY = 'jeffchannel:v1';
function persist() {
  if (!CFG.remember) return;
  try {
    // The episode sitting on the standby element hasn't aired yet, so it still
    // owes us a turn if the source gets refreshed right now.
    const pending = (nextIdx >= 0 && !bag.includes(nextIdx)) ? [nextIdx].concat(bag) : bag;
    localStorage.setItem(STORE_KEY, JSON.stringify({ sig: listSig, bag: pending, lastIdx, t: now() }));
  } catch (e) { /* private mode, blocked storage — not important */ }
}
function restore() {
  if (!CFG.remember) return false;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || s.sig !== listSig || !Array.isArray(s.bag)) return false;
    if (now() - (s.t || 0) > 12 * 3600 * 1000) return false;   // stale, start a fresh cycle
    bag = s.bag.filter(i => Number.isInteger(i) && i >= 0 && i < items.length);
    lastIdx = Number.isInteger(s.lastIdx) ? s.lastIdx : -1;
    resumed = bag.length > 0;
    log('resumed cycle, ' + bag.length + ' left');
    return resumed;
  } catch (e) { return false; }
}

/* ---------------------------------------------------------------- playback */
/**
 * Point an element at an episode and get it ready to play. Resolves once it can
 * actually start — and once it has finished seeking, if we asked it to tune in
 * partway through.
 */
let primeSeq = 0;
function prime(el, idx, seekFrac) {
  return new Promise((resolve, reject) => {
    let settled = false;
    let seeking = false;
    // If a newer prime takes over this element, this one must quietly stand down
    // instead of resolving against a source that is no longer there.
    const myToken = ++primeSeq;
    el._primeToken = myToken;

    const done = (ok, err) => {
      if (settled) return;
      settled = true;
      if (el._primeToken !== myToken) ok = false, err = new Error('superseded');
      clearTimeout(timer);
      el.removeEventListener('loadedmetadata', onMeta);
      el.removeEventListener('canplay', onCan);
      el.removeEventListener('seeked', onSeeked);
      el.removeEventListener('error', onErr);
      ok ? resolve() : reject(err || new Error('failed'));
    };

    const onMeta = () => {
      if (seekFrac == null) return;
      const d = el.duration;
      if (Number.isFinite(d) && d > 10) {
        seeking = true;
        try { el.currentTime = d * clamp(seekFrac, 0, 0.95); }
        catch (e) { seeking = false; }
      }
    };
    const onCan    = () => { if (!seeking) done(true); };
    const onSeeked = () => { done(true); };
    const onErr    = () => { done(false, new Error('media error')); };
    const timer    = setTimeout(() => done(false, new Error('timeout')), Math.max(8, CFG.stall) * 1000);

    el.addEventListener('loadedmetadata', onMeta);
    el.addEventListener('canplay', onCan);
    el.addEventListener('seeked', onSeeked);
    el.addEventListener('error', onErr);

    el.muted = true;                 // stay silent until this element is actually on screen
    el.preload = 'auto';
    el.src = items[idx].url;
    try { el.load(); } catch (e) {}
  });
}

/** Try every remaining episode until one loads into `el`. Returns the index, or -1. */
async function loadInto(el, seekFrac) {
  const attempts = Math.max(3, Math.min(items.length, 40));
  for (let n = 0; n < attempts; n++) {
    const idx = takeNext();
    if (idx < 0) return -1;
    try { await prime(el, idx, seekFrac); return idx; }
    catch (e) {
      if (e && e.message === 'superseded') { returnToBag(idx); return -1; }
      bench(idx, e.message);
    }
  }
  return -1;
}

async function startPlayback(el) {
  el.muted = audioBlocked ? true : CFG.muted;
  el.volume = clamp(CFG.volume, 0, 1);
  try {
    await el.play();
    if (!el.muted) hideMsg();
    return true;
  } catch (err) {
    // The browser refused sound-on autoplay. Fall back to muted so the channel
    // keeps running, and keep trying to bring the audio back.
    audioBlocked = true;
    el.muted = true;
    if (!IN_OBS && !CFG.muted) showMsg('Your browser blocked sound. Click anywhere to unmute.');
    try { await el.play(); return true; }
    catch (e2) { log('play rejected: ' + e2.message); return false; }
  }
}

function showTitle(idx) {
  curIdx = idx;
  elTitle.textContent = items[idx] ? items[idx].title : '';
  if (!CFG.overlay) return;
  elOvl.classList.remove('hidden');
  clearTimeout(titleTimer);
  if (CFG.titleMode === 'auto') titleTimer = setTimeout(() => elOvl.classList.add('hidden'), 10000);
}

function goLive(el, idx) {
  const other = (el === v0) ? v1 : v0;
  el.classList.add('live'); el.classList.remove('standby');
  other.classList.add('standby'); other.classList.remove('live');
  live = el; hold = other;
  setIdle(false);
  showTitle(idx);
  lastIdx = idx;
  stats.aired++;
  persist();
}

function setIdle(on) {
  idle = on;
  document.body.classList.toggle('idle', on);
  if (on) {
    clearTimeout(titleTimer);
    elOvl.classList.remove('hidden');
    elTitle.textContent = items.length ? 'Back in a moment' : 'Tuning in';
    elIdleSub.textContent = items.length ? 'Reconnecting to the library' : 'Loading library';
  }
}

function showMsg(t) { elMsg.textContent = t; }
function hideMsg()  { elMsg.textContent = ''; }

/** Prime the standby element with whatever airs next. */
let queueToken = 0;
async function queueNext() {
  const tok = ++queueToken;
  nextIdx = -1;
  const el = hold;
  try { el.pause(); } catch (e) {}
  const idx = await loadInto(el, null);
  if (tok !== queueToken) {                // a swap happened while we were loading
    returnToBag(idx);                      // give this episode its turn back
    return;
  }
  nextIdx = idx;
  if (idx < 0) log('nothing could be queued');
}

/** Hard cut to the next episode. */
async function advance(reason) {
  if (advancing) return;
  advancing = true;
  try {
    if (nextIdx < 0) {
      queueToken++;                        // invalidate any in-flight queueNext
      // Standby was not ready (slow network, or the queued file died). Load now.
      const idx = await loadInto(hold, null);
      if (idx < 0) { setIdle(true); scheduleRecovery(); return; }
      nextIdx = idx;
    }
    const idx = nextIdx;
    const incoming = hold;
    const outgoing = live;

    goLive(incoming, idx);
    await startPlayback(incoming);

    // Release the element we just left so it stops buffering.
    try {
      outgoing.pause();
      outgoing.removeAttribute('src');
      outgoing.load();
    } catch (e) {}

    resetWatchdog();
    queueNext();
  } finally {
    advancing = false;
  }
}

let recoveryTimer = null, recovering = false;
async function runRecovery() {
  if (recovering) return;
  recovering = true;
  if (recoveryTimer) { clearTimeout(recoveryTimer); recoveryTimer = null; }
  try {
    log('recovery sweep');
    // A sweep is exactly the moment to re-read the playlist — the fix may well
    // have been to edit videos.txt.
    try {
      const fresh = await fetchPlaylist();
      if (fresh.length) applyFreshList(fresh);
    } catch (e) { /* still down; carry on with what we have */ }

    items.forEach(it => { it.deadUntil = 0; });   // unbench everything and try again
    bag = [];
    queueToken++;
    const idx = await loadInto(hold, null);
    if (idx < 0) { scheduleRecovery(); return; }
    nextIdx = idx;
    advance('recovery');
  } finally {
    recovering = false;
  }
}
function scheduleRecovery() {
  if (recoveryTimer) return;
  recoveryTimer = setTimeout(runRecovery, 15000);
}

/* ---------------------------------------------------------------- watchdog */
let lastTime = 0, stalledFor = 0;
function resetWatchdog() { lastTime = -1; stalledFor = 0; }

setInterval(() => {
  if (!live || advancing || idle) return;
  if (offAirAt !== null) return;                 // deliberately paused by the saver
  if (live.seeking || live.ended) { stalledFor = 0; return; }

  const t = live.currentTime;
  if (Math.abs(t - lastTime) < 0.02) {
    stalledFor += 2;
    if (live.paused) startPlayback(live);        // something paused us — resume
    if (stalledFor >= CFG.stall) {
      log('stalled at ' + t.toFixed(1) + 's, skipping');
      bench(curIdx, 'stall');
      stalledFor = 0;
      advance('stall');
    }
  } else {
    stalledFor = 0;
    lastTime = t;
  }
}, 2000);

/* ---------------------------------------------------------------- events */
[v0, v1].forEach(el => {
  el.addEventListener('ended', e => { if (e.target === live) advance('ended'); });
  el.addEventListener('error', e => {
    // Standby failures are handled inside loadInto; so is the deliberate
    // teardown of the element we just cut away from.
    if (e.target !== live || curIdx < 0 || idle || advancing) return;
    bench(curIdx, 'runtime error');
    advance('error');
  });
});

/* ---- OBS scene changes: optional bandwidth saver ---- */
window.addEventListener('obsSourceActiveChanged', e => {
  const active = e && e.detail ? e.detail.active : true;
  if (active) {
    if (CFG.saver && offAirAt !== null) {
      // Pretend it kept running: skip ahead by however long we were off-air.
      const away = (now() - offAirAt) / 1000;
      offAirAt = null;
      if (live && Number.isFinite(live.duration) && live.currentTime + away < live.duration - 5) {
        try { live.currentTime += away; } catch (err) {}
        startPlayback(live);
      } else {
        advance('saver-overrun');
      }
      resetWatchdog();
    }
    if (curIdx >= 0) showTitle(curIdx);          // re-show the title on the way back
  } else if (CFG.saver) {
    offAirAt = now();
    try { if (live) live.pause(); } catch (err) {}
  }
});

/* Any interaction in OBS "Interact" mode (or a browser tab) unlocks audio. */
function unlockAudio() {
  if (!audioBlocked) return;
  audioBlocked = false;
  if (live) { live.muted = CFG.muted; live.volume = clamp(CFG.volume, 0, 1); live.play().catch(() => {}); }
  hideMsg();
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, unlockAudio, { passive: true }));

/* Some embedded browsers relent a few seconds in — keep trying quietly. */
let unmuteTries = 0;
setInterval(() => {
  if (!audioBlocked || CFG.muted || unmuteTries > 40 || !live) return;
  unmuteTries++;
  live.muted = false;
  live.play().then(() => { audioBlocked = false; hideMsg(); })
             .catch(() => { live.muted = true; });
}, 15000);

window.addEventListener('keydown', e => {
  if (e.key === 'n' || e.key === 'N') advance('manual');
  if (e.key === 'd' || e.key === 'D') document.body.classList.toggle('debug');
});

/* ---------------------------------------------------------------- logging */
const logLines = [];
function log(msg) {
  logLines.push(new Date().toLocaleTimeString() + '  ' + msg);
  if (logLines.length > 14) logLines.shift();
  if (CFG.debug) console.log('[channel] ' + msg);
}

setInterval(() => {
  if (!document.body.classList.contains('debug')) return;
  const buffered = (live && live.buffered.length)
    ? (live.buffered.end(live.buffered.length - 1) - live.currentTime).toFixed(1) + 's ahead'
    : '—';
  const dead = items.filter(i => i.deadUntil > now()).length;
  const up = Math.floor((now() - stats.started) / 1000);
  elDbg.textContent = [
    'JEFF CHANNEL  [' + THEME + ']',
    'uptime      ' + Math.floor(up / 3600) + 'h ' + Math.floor(up / 60) % 60 + 'm',
    'episodes    ' + items.length + '  (benched ' + dead + ')',
    'left in bag ' + bag.length,
    'aired       ' + stats.aired + '   skipped ' + stats.skipped + '   cycles ' + stats.cycles,
    'now         [' + curIdx + '] ' + (items[curIdx] ? items[curIdx].title : '—'),
    'next        [' + nextIdx + '] ' + (items[nextIdx] ? items[nextIdx].title : 'not ready'),
    'time        ' + (live ? live.currentTime.toFixed(1) : '0') + ' / ' +
                     (live && Number.isFinite(live.duration) ? live.duration.toFixed(1) : '?'),
    'ready       ' + (live ? live.readyState : '-') + '   buffer ' + buffered,
    'audio       ' + (audioBlocked ? 'BLOCKED (muted)' : (CFG.muted ? 'muted by config' : 'on')),
    'obs         ' + (IN_OBS ? 'yes' : 'no') + (CFG.saver ? '   saver on' + (offAirAt ? ' (off-air)' : '') : ''),
    '',
    logLines.join('\n')
  ].join('\n');
}, 1000);

/* ---------------------------------------------------------------- playlist */
async function fetchPlaylist() {
  const url = CFG.list + (CFG.list.includes('?') ? '&' : '?') + '_=' + Date.now();
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('playlist HTTP ' + res.status);
  return parsePlaylist(await res.text());
}

function signature(list) {
  return list.length + ':' + list.map(i => i.url).join('|').length;
}

/** Swap in a new playlist, keeping our place if the current episode survived. */
function applyFreshList(fresh) {
  const sig = signature(fresh);
  if (sig === listSig) return false;
  const currentUrl = items[curIdx] ? items[curIdx].url : null;
  items = fresh;
  listSig = sig;
  bag = [];
  curIdx = fresh.findIndex(i => i.url === currentUrl);
  lastIdx = curIdx;
  log('playlist updated: ' + fresh.length + ' episodes');
  return true;
}

/** Optional: pick up playlist edits without restarting the OBS source. */
async function refreshPlaylist() {
  try {
    const fresh = await fetchPlaylist();
    if (!fresh.length) return;
    if (!applyFreshList(fresh)) return;
    // If we were sitting on the standby card, new episodes are a reason to
    // try again right now rather than waiting for the next recovery sweep.
    if (idle) runRecovery(); else queueNext();
  } catch (e) { log('refresh failed: ' + e.message); }
}

/* ---------------------------------------------------------------- boot */
async function boot() {
  setIdle(true);

  // Keep retrying the playlist — a break screen must never give up.
  let loaded = null;
  for (let attempt = 0; ; attempt++) {
    try { loaded = await fetchPlaylist(); if (loaded.length) break; throw new Error('playlist is empty'); }
    catch (e) {
      log('playlist: ' + e.message);
      elIdleSub.textContent = 'Retrying ' + CFG.list;
      await sleep(Math.min(30000, 2000 * Math.pow(1.6, Math.min(attempt, 8))));
    }
  }

  items = loaded;
  listSig = signature(items);
  log('loaded ' + items.length + ' episodes');

  // Install this BEFORE any early return — if the channel can't start, picking
  // up an edited playlist is the main way it ever comes back.
  if (CFG.reload > 0) setInterval(refreshPlaylist, CFG.reload * 1000);

  if (!restore()) refillBag();

  const lo = clamp(CFG.startMin, 0, 0.95), hi = clamp(CFG.startMax, 0, 0.95);
  const seek = CFG.startMid ? lo + Math.random() * Math.max(0, hi - lo) : null;

  const idx = await loadInto(v0, seek);
  if (idx < 0) { setIdle(true); scheduleRecovery(); return; }

  goLive(v0, idx);
  await startPlayback(v0);
  resetWatchdog();
  queueNext();
}

/* A small hook for diagnostics and for wiring this up to a stream deck. */
window.breakChannel = window.jeffChannel = {
  cfg: CFG,
  get state() {
    return {
      count: items.length, current: curIdx, next: nextIdx,
      title: items[curIdx] ? items[curIdx].title : null,
      remaining: bag.length,
      benched: items.filter(i => i.deadUntil > now()).length,
      idle, audioBlocked, resumed, theme: THEME, stats
    };
  },
  get playlist() { return items.map(i => ({ title: i.title, url: i.url, fails: i.fails })); },
  next: () => advance('api'),
  mute: on => { CFG.muted = !!on; if (live) live.muted = !!on; },
  reload: () => refreshPlaylist()
};

boot();
</script>
</body>
</html>
